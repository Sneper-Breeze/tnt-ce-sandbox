name: Sync CE revision to EE

on:
  push:
    branches: [main, 'release/**']

permissions:
  contents: read

jobs:
  update-ee-submodule:
    if: github.repository == 'Sneper-Breeze/tnt-ce-sandbox'
    runs-on: ubuntu-latest
    env:
      EE_REPOSITORY: Sneper-Breeze/tnt-backport
      EE_FEATURE_BRANCH: TarantoolBot/update-tarantool-${{ github.ref_name }}
      CE_SHA: ${{ github.sha }}
    steps:
      - name: Map CE branch to EE branch
        id: branch
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            main|release/*) echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported CE branch: $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac
      - name: Check out EE target branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.EE_REPOSITORY }}
          ref: ${{ steps.branch.outputs.name }}
          token: ${{ secrets.EE_UPDATE_SUBMODULE_TOKEN }}
          submodules: recursive
          path: ee
      - name: Advance the CE submodule
        working-directory: ee
        shell: bash
        run: |
          test -d tarantool || {
            echo 'The EE target branch has no tarantool submodule yet; skipping synchronization.'
            exit 0
          }
          git -C tarantool fetch --depth=1 origin "$CE_SHA"
          git -C tarantool checkout "$CE_SHA"
          git add tarantool
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create "$EE_FEATURE_BRANCH"
          git commit -m 'tarantool: bump to new CE revision'
          git push --set-upstream origin "$EE_FEATURE_BRANCH"
      - name: Create EE pull request
        working-directory: ee
        env:
          GH_TOKEN: ${{ secrets.EE_UPDATE_SUBMODULE_TOKEN }}
          EE_TARGET_BRANCH: ${{ steps.branch.outputs.name }}
        shell: bash
        run: |
          git diff "origin/$EE_TARGET_BRANCH"...HEAD --quiet && exit 0
          gh pr create \
            --base "$EE_TARGET_BRANCH" \
            --head "$EE_FEATURE_BRANCH" \
            --title 'tarantool: bump to new CE revision' \
            --body "Updates the tarantool submodule to CE commit $CE_SHA."
