name: Backport CE change

on:
  pull_request_target:
    types: [closed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  backport:
    if: >
      github.repository == 'Sneper-Breeze/tnt-ce-sandbox' &&
      ((github.event_name == 'pull_request_target' && github.event.pull_request.merged) ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/backport')))
    runs-on: ubuntu-latest
    steps:
      - id: targets
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          result-encoding: string
          script: |
            const labels = context.payload.pull_request?.labels || []
            const targets = context.payload.comment
              ? context.payload.comment.body.slice('/backport'.length).trim().split(/\s+/).filter(Boolean)
              : labels.filter(label => label.name.startsWith('backport/'))
                  .map(label => label.name.slice('backport/'.length))
            return targets.map(target => `release/${target}`).join(' ')
      - uses: actions/checkout@v4
      - name: Create CE backport pull requests
        if: steps.targets.outputs.result != ''
        uses: korthout/backport-action@v3
        with:
          github_token: ${{ github.token }}
          target_branches: ${{ steps.targets.outputs.result }}
          label_pattern: ''
          copy_labels_pattern: ^((?!backport).*)$
